name: Validate COD-only buyer payments

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/check-inline-js.mjs'
      - 'supabase/migrations/**'
      - '.github/workflows/validate-cod-only.yml'

permissions:
  contents: read

jobs:
  cod-only-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate JavaScript, security checks, and COD-only payment policy
        run: node scripts/check-inline-js.mjs
