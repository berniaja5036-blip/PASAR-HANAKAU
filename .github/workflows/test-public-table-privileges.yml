name: Test public table privilege hardening

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261122052600_revoke_unneeded_public_table_maintenance_privileges.sql'
      - 'tests/security-privileges/**'
      - '.github/workflows/test-public-table-privileges.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261122052600_revoke_unneeded_public_table_maintenance_privileges.sql'
      - 'tests/security-privileges/**'
      - '.github/workflows/test-public-table-privileges.yml'

permissions:
  contents: read

jobs:
  postgres-17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bootstrap
          POSTGRES_PASSWORD: bootstrap
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create roles and reproduce the existing privilege defaults
        env:
          PGPASSWORD: bootstrap
        run: psql -h localhost -U bootstrap -d postgres -v ON_ERROR_STOP=1 -f tests/security-privileges/bootstrap.sql
      - name: Apply production privilege-hardening migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261122052600_revoke_unneeded_public_table_maintenance_privileges.sql
      - name: Assert existing and future public tables have least-privilege grants
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/security-privileges/assertions.sql
