name: Fix password recovery redirect
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-auth-redirect.yml
permissions:
  contents: read
jobs:
  update-auth-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure and verify production recovery redirect
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: wnnnhiocyyozlkfqupav
          PRODUCTION_URL: https://berniaja5036-blip.github.io/PASAR-HANAKAU/
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repository secret is missing."
            exit 1
          fi
          node <<'NODE'
          const base = 'https://api.supabase.com/v1/projects/' + process.env.SUPABASE_PROJECT_REF + '/config/auth';
          const headers = {
            Authorization: 'Bearer ' + process.env.SUPABASE_ACCESS_TOKEN,
            'Content-Type': 'application/json'
          };
          async function main() {
            const currentResponse = await fetch(base, { headers });
            if (!currentResponse.ok) {
              const detail = await currentResponse.text();
              console.error('Could not read Supabase Auth config. HTTP', currentResponse.status);
              console.error('Supabase response:', detail.slice(0, 1200));
              process.exit(1);
            }
            const current = await currentResponse.json();
            const url = process.env.PRODUCTION_URL;
            const existing = String(current.uri_allow_list || '').split(',').map(x => x.trim()).filter(Boolean);
            if (!existing.includes(url)) existing.push(url);
            const updateResponse = await fetch(base, {
              method: 'PATCH',
              headers,
              body: JSON.stringify({ site_url: url, uri_allow_list: existing.join(',') })
            });
            if (!updateResponse.ok) {
              const detail = await updateResponse.text();
              console.error('Supabase redirect configuration update failed. HTTP', updateResponse.status);
              console.error('Supabase response:', detail.slice(0, 1200));
              process.exit(1);
            }
            const verifyResponse = await fetch(base, { headers });
            if (!verifyResponse.ok) throw new Error('Could not verify updated Auth configuration.');
            const verified = await verifyResponse.json();
            const allowed = String(verified.uri_allow_list || '').split(',').map(x => x.trim());
            if (verified.site_url !== url || !allowed.includes(url)) {
              throw new Error('Production Site URL or redirect allow-list verification failed.');
            }
            console.log('SUCCESS: Production recovery redirect URL is configured and verified.');
            console.log('RECOVERY EMAIL SUBJECT:', verified.mailer_subjects_recovery || '(default Supabase subject)');
            console.log('SMTP HOST CONFIGURED:', Boolean(verified.smtp_host));
            console.log('SMTP SENDER CONFIGURED:', Boolean(verified.smtp_admin_email));
            console.log('SMTP USER CONFIGURED:', Boolean(verified.smtp_user));
            console.log('AUTH EMAIL RATE LIMIT:', verified.rate_limit_email_sent ?? '(not exposed)');
            console.log('AUTH EMAIL OTP EXPIRY:', verified.email_otp_exp ?? '(not exposed)');
            console.log('RECOVERY EMAIL TEMPLATE:', verified.mailer_templates_recovery_content || '(empty; Supabase built-in default template is in use)');
            console.log('NOTE: Recovery email template was intentionally not modified because Supabase Free with the default email provider blocks custom templates.');
          }
          main().catch(error => {
            console.error('Recovery redirect configuration failed:', error.message);
            process.exit(1);
          });
          NODE
