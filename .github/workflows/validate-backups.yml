name: Validate encrypted backups

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-backups.yml"

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install PostgreSQL server and GPG
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql postgresql-client gnupg
          sudo service postgresql start

      - name: Download database backup artifact
        uses: actions/download-artifact@v4
        with:
          name: pasar-hanakau-database-backup-43195273305
          path: backup/database
          repository: ${{ github.repository }}
          run-id: 43195273305
          github-token: ${{ github.token }}

      - name: Download Storage backup artifact
        uses: actions/download-artifact@v4
        with:
          name: pasar-hanakau-storage-backup-43201334358
          path: backup/storage
          repository: ${{ github.repository }}
          run-id: 43201334358
          github-token: ${{ github.token }}

      - name: Decrypt and validate database archive
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "${BACKUP_ENCRYPTION_PASSPHRASE}"
          cd backup/database
          sha256sum -c SHA256SUMS.txt
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${BACKUP_ENCRYPTION_PASSPHRASE}" \
            --output pasar-hanakau-db.dump \
            --decrypt pasar-hanakau-db.dump.gpg
          test -s pasar-hanakau-db.dump
          pg_restore --list pasar-hanakau-db.dump > database-contents.txt
          grep -q "TABLE DATA" database-contents.txt
          echo "Database backup decrypted; checksum and PostgreSQL archive structure are valid."

      - name: Restore database into temporary local PostgreSQL
        run: |
          set -euo pipefail
          sudo -u postgres createdb backup_restore_test
          sudo -u postgres pg_restore --no-owner --no-acl --exit-on-error \
            --dbname=backup_restore_test backup/database/pasar-hanakau-db.dump
          table_count=$(sudo -u postgres psql -d backup_restore_test -Atc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema NOT IN ('pg_catalog','information_schema');")
          echo "Temporary local database restore succeeded; restored tables: ${table_count}"
          test "${table_count}" -gt 0

      - name: Decrypt, verify, and extract Storage archive
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd backup/storage
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${BACKUP_ENCRYPTION_PASSPHRASE}" \
            --output pasar-hanakau-storage.tar.gz \
            --decrypt pasar-hanakau-storage.tar.gz.gpg
          awk '{print $1 "  pasar-hanakau-storage.tar.gz"}' SHA256SUMS.txt | sha256sum -c -
          tar -tzf pasar-hanakau-storage.tar.gz > storage-contents.txt
          for bucket in product-images profile-avatars driver-private-documents chat-attachments; do
            grep -q "storage/${bucket}/" storage-contents.txt
          done
          mkdir -p /tmp/pasar-hanakau-storage-restore
          tar -xzf pasar-hanakau-storage.tar.gz -C /tmp/pasar-hanakau-storage-restore
          for bucket in product-images profile-avatars driver-private-documents chat-attachments; do
            test -d "/tmp/pasar-hanakau-storage-restore/storage/${bucket}"
          done
          file_count=$(find /tmp/pasar-hanakau-storage-restore/storage -type f | wc -l)
          echo "Storage archive extracted successfully; restored files: ${file_count}; all four bucket folders are present."
