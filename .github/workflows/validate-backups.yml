name: Validate encrypted backups

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-backups.yml"
  schedule:
    # Run after both weekly backups (Monday 03:15 WIB / Sunday 20:15 UTC)
    - cron: "15 20 * * 0"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Find latest successful database and Storage backups
        id: latest
        uses: actions/github-script@v7
        with:
          script: |
            const workflows = [
              ["database", "database-backup.yml"],
              ["storage", "storage-backup.yml"],
            ];

            for (const [key, workflow_id] of workflows) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id,
                per_page: 20,
              });
              const latest = response.data.workflow_runs[0];

              if (!latest) {
                core.setFailed(`No run found for ${workflow_id}; refusing to validate stale backups.`);
                return;
              }

              if (latest.status !== "completed" || latest.conclusion !== "success") {
                core.setFailed(`Latest ${workflow_id} run ${latest.id} is ${latest.status}/${latest.conclusion}; refusing to validate an older backup as current.`);
                return;
              }

              core.setOutput(`${key}_run_id`, String(latest.id));
              core.info(`Selected latest successful ${workflow_id} run: ${latest.id}`);
            }

      - name: Install PostgreSQL server and GPG
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql postgresql-client gnupg
          sudo service postgresql start

      - name: Download latest database backup artifact
        uses: actions/download-artifact@v4
        with:
          name: pasar-hanakau-database-backup-${{ steps.latest.outputs.database_run_id }}
          path: backup/database
          repository: ${{ github.repository }}
          run-id: ${{ steps.latest.outputs.database_run_id }}
          github-token: ${{ github.token }}

      - name: Download latest Storage backup artifact
        uses: actions/download-artifact@v4
        with:
          name: pasar-hanakau-storage-backup-${{ steps.latest.outputs.storage_run_id }}
          path: backup/storage
          repository: ${{ github.repository }}
          run-id: ${{ steps.latest.outputs.storage_run_id }}
          github-token: ${{ github.token }}

      - name: Decrypt and validate database archive
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "${BACKUP_ENCRYPTION_PASSPHRASE}"
          cd backup/database
          sha256sum -c SHA256SUMS.txt
          gpg --batch --yes --pinentry-mode loopback --passphrase "${BACKUP_ENCRYPTION_PASSPHRASE}" --output pasar-hanakau-db.dump --decrypt pasar-hanakau-db.dump.gpg
          test -s pasar-hanakau-db.dump
          pg_restore --list pasar-hanakau-db.dump > database-contents.txt
          grep -q "TABLE DATA" database-contents.txt
          echo "Latest database backup decrypted; checksum and PostgreSQL archive structure are valid."

      - name: Restore database into temporary local PostgreSQL
        run: |
          set -euo pipefail
          sudo -u postgres createdb backup_restore_test
          sudo -u postgres psql -d backup_restore_test -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF; IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF; IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN; END IF; END \$\$;"
          # Skip only CREATE EXTENSION entries unavailable on the generic runner;
          # the Supabase production project retains its own managed extensions.
          pg_restore --list backup/database/pasar-hanakau-db.dump | grep -v ' EXTENSION - ' | grep -v ' vault ' > backup/database/restore.list
          sudo -u postgres pg_restore --use-list=backup/database/restore.list --no-owner --no-acl --no-comments --exit-on-error --dbname=backup_restore_test backup/database/pasar-hanakau-db.dump
          table_count=$(sudo -u postgres psql -d backup_restore_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema NOT IN ('pg_catalog','information_schema');")
          echo "Temporary local database restore succeeded; restored tables: ${table_count}"
          test "${table_count}" -gt 0

      - name: Decrypt, verify, and extract Storage archive
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "${BACKUP_ENCRYPTION_PASSPHRASE}"
          cd backup/storage
          gpg --batch --yes --pinentry-mode loopback --passphrase "${BACKUP_ENCRYPTION_PASSPHRASE}" --output pasar-hanakau-storage.tar.gz --decrypt pasar-hanakau-storage.tar.gz.gpg
          awk '{print $1 "  pasar-hanakau-storage.tar.gz"}' SHA256SUMS.txt | sha256sum -c -
          tar -tzf pasar-hanakau-storage.tar.gz > storage-contents.txt
          for bucket in product-images profile-avatars driver-private-documents chat-attachments; do
            grep -q "storage/${bucket}/" storage-contents.txt
          done
          mkdir -p /tmp/pasar-hanakau-storage-restore
          tar -xzf pasar-hanakau-storage.tar.gz -C /tmp/pasar-hanakau-storage-restore
          for bucket in product-images profile-avatars driver-private-documents chat-attachments; do
            test -d "/tmp/pasar-hanakau-storage-restore/storage/${bucket}"
          done
          file_count=$(find /tmp/pasar-hanakau-storage-restore/storage -type f | wc -l)
          echo "Latest Storage archive extracted successfully; restored files: ${file_count}; all four bucket folders are present."
