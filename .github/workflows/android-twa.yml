name: Build Pasar Hanakau Android App

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'buyer/**'
      - 'scripts/check-inline-js.mjs'
      - 'scripts/check-buyer-webview.mjs'
      - 'docs/**'
      - '.github/workflows/android-twa.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'buyer/**'
      - 'scripts/check-inline-js.mjs'
      - 'scripts/check-buyer-webview.mjs'
      - 'icons/**'
      - 'docs/**'
      - '.github/workflows/android-twa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pasar-hanakau-android-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore the existing app signing key from GitHub Secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          mkdir -p android/android-keystore android/app/src/main/res/drawable-nodpi
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/android-keystore/pasar-hanakau.keystore
          test -s android/android-keystore/pasar-hanakau.keystore
          keytool -list -keystore android/android-keystore/pasar-hanakau.keystore -storetype PKCS12 -alias pasar-hanakau -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
          cat > android/key.properties <<EOF
          storeFile=android-keystore/pasar-hanakau.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=pasar-hanakau
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          curl --fail --silent --show-error "https://berniaja5036-blip.github.io/PASAR-HANAKAU/icons/icon-512.png" -o android/app/src/main/res/drawable-nodpi/launcher.png
          file android/app/src/main/res/drawable-nodpi/launcher.png

      - name: Validate marketplace inline JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.current = None
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script" and not dict(attrs).get("src"):
                      self.current = []

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      self.scripts.append("".join(self.current))
                      self.current = None

              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)

          parser = InlineScripts()
          for source_path in ["index.html", "buyer/index.html"]:
              parser.feed(Path(source_path).read_text(encoding="utf-8"))
          if not parser.scripts:
              raise SystemExit("No inline marketplace scripts found")
          for index, script in enumerate(parser.scripts):
              Path(f"/tmp/pasar-hanakau-inline-{index}.js").write_text(script, encoding="utf-8")
          print(f"Found {len(parser.scripts)} inline script block(s)")
          PY
          for script in /tmp/pasar-hanakau-inline-*.js; do
            node --check "$script"
          done

      - name: Run marketplace security and native cart regression checks
        run: node scripts/check-inline-js.mjs

      - name: Validate buyer WebView route and PWA scope
        run: node scripts/check-buyer-webview.mjs

      - name: Verify buyer-only public entry points
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          buyer_html = Path("buyer/index.html").read_text(encoding="utf-8")
          buyer_roles = set(re.findall(r'data-entry-role="([^"]+)"', buyer_html))
          if buyer_roles != {"buyer"}:
              raise SystemExit(f"Buyer WebView roles must be buyer-only; found: {sorted(buyer_roles)}")
          if 'id="togglePartnerAccess"' in buyer_html:
              raise SystemExit("Buyer WebView must not expose partner access toggle")
          if "if(role!=='buyer')" not in buyer_html:
              raise SystemExit("Non-buyer session guard is missing from buyer WebView")
          if "if(selectedEntryRole!=='buyer')" not in buyer_html:
              raise SystemExit("Buyer-only signup guard is missing from buyer WebView")
          main_activity = Path("android/app/src/main/java/id/pasarhanakau/mobile/MainActivity.java").read_text(encoding="utf-8")
          if 'https://berniaja5036-blip.github.io/PASAR-HANAKAU/buyer/' not in main_activity:
              raise SystemExit("Android WebView must load the dedicated buyer route")
          print("Dedicated buyer WebView and Android route verified; root website remains independent")
          PY

      - name: Build signed standalone APK and Android App Bundle
        run: |
          cd android
          gradle --no-daemon clean assembleRelease bundleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pasar-hanakau-android-standalone
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
