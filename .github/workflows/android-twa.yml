name: Build Pasar Hanakau Android App

on:
  push:
    branches: [main, native-android-foundation]
    paths:
      - 'android/**'
      - '.github/workflows/android-twa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pasar-hanakau-android-release
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore the existing app signing key
        uses: actions/cache/restore@v4
        with:
          path: android/android-keystore/pasar-hanakau.keystore
          key: pasar-hanakau-signing-keystore-v1

      - name: Prepare signing and launcher icon
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          mkdir -p android/android-keystore android/app/src/main/res/drawable-nodpi
          if [ ! -s android/android-keystore/pasar-hanakau.keystore ]; then
            echo "::error::Kunci tanda tangan aplikasi yang lama tidak ditemukan di cache. Build dihentikan agar APK tidak memakai kunci baru dan tetap dapat memperbarui versi sebelumnya."
            exit 1
          fi
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          keytool -list -keystore android/android-keystore/pasar-hanakau.keystore -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
          cat > android/key.properties <<EOF
          storeFile=android-keystore/pasar-hanakau.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=pasar-hanakau
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          curl --fail --silent --show-error "https://berniaja5036-blip.github.io/PASAR-HANAKAU/icons/icon-512.png" -o android/app/src/main/res/drawable-nodpi/launcher.png
          file android/app/src/main/res/drawable-nodpi/launcher.png

      - name: Build signed standalone APK and Android App Bundle
        run: |
          cd android
          gradle --no-daemon clean assembleRelease bundleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pasar-hanakau-android-standalone
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
