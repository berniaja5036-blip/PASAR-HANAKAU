name: Build Pasar Hanakau Android App

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'scripts/check-inline-js.mjs'
      - '.github/workflows/android-twa.yml'
  push:
    branches: [main, buyer-runtime-mode]
    paths:
      - 'android/**'
      - 'index.html'
      - 'scripts/check-inline-js.mjs'
      - '.github/workflows/android-twa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pasar-hanakau-android-release
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore the existing app signing key
        uses: actions/cache/restore@v4
        with:
          path: android/android-keystore/pasar-hanakau.keystore
          key: pasar-hanakau-signing-keystore-v1

      - name: Prepare signing and launcher icon
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          mkdir -p android/android-keystore android/app/src/main/res/drawable-nodpi
          if [ ! -s android/android-keystore/pasar-hanakau.keystore ]; then
            echo "::error::Kunci tanda tangan aplikasi yang lama tidak ditemukan di cache. Build dihentikan agar APK tidak memakai kunci baru dan tetap dapat memperbarui versi sebelumnya."
            exit 1
          fi
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          keytool -list -keystore android/android-keystore/pasar-hanakau.keystore -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
          cat > android/key.properties <<EOF
          storeFile=android-keystore/pasar-hanakau.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=pasar-hanakau
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          curl --fail --silent --show-error "https://berniaja5036-blip.github.io/PASAR-HANAKAU/icons/icon-512.png" -o android/app/src/main/res/drawable-nodpi/launcher.png
          file android/app/src/main/res/drawable-nodpi/launcher.png

      - name: Validate marketplace inline JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.current=None; self.scripts=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower()=="script" and not dict(attrs).get("src"): self.current=[]
              def handle_endtag(self, tag):
                  if tag.lower()=="script" and self.current is not None: self.scripts.append("".join(self.current)); self.current=None
              def handle_data(self, data):
                  if self.current is not None: self.current.append(data)
          parser=InlineScripts(); parser.feed(Path("index.html").read_text(encoding="utf-8"))
          for i,script in enumerate(parser.scripts): Path(f"/tmp/ph-{i}.js").write_text(script,encoding="utf-8")
          if not parser.scripts: raise SystemExit("No inline scripts found")
          PY
          for script in /tmp/ph-*.js; do node --check "$script"; done
      - name: Run marketplace security and native buyer regression checks
        run: node scripts/check-inline-js.mjs
      - name: Verify buyer runtime mode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path("index.html").read_text(encoding="utf-8")
          required=["get('client') === 'buyer'","if(nativeBuyerMode&&role!=='buyer')","nativeBuyerMode&&selectedEntryRole!=='buyer'","id=\"togglePartnerAccess\"", "if(nativeBuyerMode){"]
          for item in required:
              if item not in html: raise SystemExit("Missing native buyer mode guard: "+item)
          print("Buyer runtime mode checks passed")
          PY
      - name: Build signed standalone APK and Android App Bundle
        run: |
          cd android
          gradle --no-daemon clean assembleRelease bundleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pasar-hanakau-android-standalone
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
